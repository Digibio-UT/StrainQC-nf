server {
    listen 80;
    server_name localhost;

    # Increase max upload size to 50G to handle large FASTQ files
    client_max_body_size 50G;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React App
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Backend Service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large file uploads
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Proxy Results Files (Static files served by backend)
    # The backend mounts /results_files path, usually via app.mount("/results_files", ...)
    location /results_files/ {
        proxy_pass http://backend:8000/results_files/;
        proxy_set_header Host $host;
    }
}
