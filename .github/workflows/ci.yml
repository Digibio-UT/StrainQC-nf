# CI — runs on every push and pull request, on free GitHub runners (no HPC, no containers,
# no bioinformatics tools needed):
#   python   : pytest + coverage for bin/ (parsers, results.json contract, CNV summariser)
#   nf-test  : pipeline dry runs (-preview: start-up logic, input validation) and stub runs
#              (-stub: channel wiring, task counts, output layout) — tests/main.nf.test
# Full runs with real tools (the Ottilie benchmark) stay manual/scheduled on the HPC.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: bin/ unit + contract tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-cov jsonschema
      - run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  nf-test:
    name: pipeline tests (nf-test, -preview + -stub)
    runs-on: ubuntu-latest
    env:
      NXF_ANSI_LOG: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.2"
      - uses: nf-core/setup-nf-test@v1
        with:
          version: "0.9.5"
      - run: nf-test test tests/main.nf.test --verbose
